[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-agent"
version = "0.1.0"
description = "SOC investigation agent. Milestone 6 writes a verified report and stores analyst review."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Sentinel Agent contributors" }]
dependencies = [
    "fastapi>=0.141.1,<1",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "uvicorn>=0.53.0,<1",
    "sqlalchemy>=2.0.54,<3",
    "alembic>=1.20.0,<2",
    "psycopg[binary]>=3.3.6,<4",
    "httpx2>=2.13.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "httpx2>=2.13.0,<3",
    "ruff>=0.16.8,<1",
    "mypy>=2.3.1,<3",
    "bandit>=1.9.4,<2",
    "pip-audit>=2.10.1,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel = ["py.typed", "data/attack/*.json", "data/attack/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sentinel"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
