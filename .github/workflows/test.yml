name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # CI database only. The password is not a production secret and is not a Python default.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SENTINEL_TEST_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@localhost:5432/sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Type check
        run: mypy src/sentinel
      - name: Test
        run: pytest
      - name: Offline evaluations
        run: |
          python -m sentinel.evals run --output-dir evals/out
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evals/out/report.json").read_text(encoding="utf-8"))
          schema = report["metrics"]["schema_compliance"]
          if schema["denominator"] < 1 or schema["numerator"] != schema["denominator"]:
              raise SystemExit("schema compliance is not total")
          PY
