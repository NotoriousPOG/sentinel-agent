name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Bandit
        run: bandit -r src -ll
      - name: pip-audit
        run: pip-audit
      - name: Security-relevant tests
        run: pytest tests/test_security_contracts.py tests/test_reports.py -q
